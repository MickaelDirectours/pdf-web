spring.profiles.active=pms
spring.application.name=pdf-web

application.version=1.0

ENVIRONMENT=recette
SITE=
dynamodb.prefix=jettours

# Spring Boot application properties
server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.modificationTestInterval=1
server.servlet.context-path=/
server.port=8443
server.ssl.key-store=c:/sources/keystore.ImportKey
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA
server.ssl.key-alias=importkey
server.ssl.key-store-password=importkey
spring.devtools.restart.enabled=false
spring.devtools.restart.additional-exclude=WEB-INF/**
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


server.servlet.context-parameters.resourcesVersion=@project.version@
server.servlet.context-parameters.env=${environment.exec}

################################
# File manager configuration   #
################################

fileManager.s3bucket=jt-resources
fileManager.basePath=userfiles
fileManager.maxUploadSize=5000000
fileManager.publicBasePath=https://s3-eu-west-1.b-cdn.net/jt-resources

############################
# Configuration Datasource #
############################
spring.jpa.open-in-view=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pdf
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=5

###########################
# Liquibase #
###########################
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml

